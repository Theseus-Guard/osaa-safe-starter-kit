# HTTPS only. The certificate and key are mounted read-only at /etc/nginx/tls (see compose.yaml).
# Without these files nginx refuses to start. There is no plain-HTTP fallback and no HTTP redirect listener.
#
# X-Forwarded-For is set to $remote_addr, the address of the direct peer. It overwrites any value the client sent; it
# is never appended to. The API reads it only from the gateway's address (SAFE_TRUSTED_PROXIES in compose.yaml).

# Coarse per-client limits in front of the API. The API keeps its own finer login limits in PostgreSQL.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_status 429;

server {
    listen 8443 ssl;
    server_name _;
    client_max_body_size 55m;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    # Login is the brute-force target. Only the token endpoint gets the strict zone; /auth/me is called on every page load.
    location = /api/v1/auth/token {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Session cookies (safe_access, safe_refresh, safe_csrf) pass through unchanged in both directions: nginx forwards
    # Cookie and Set-Cookie by default. The API sets Secure, HttpOnly and SameSite=Strict on them, and this listener is
    # HTTPS only, so do not add proxy_cookie_* rules here.
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
