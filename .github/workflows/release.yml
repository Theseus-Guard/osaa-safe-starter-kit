name: Release on tag

# A pushed version tag (v0.2.1, v0.2.2, ...) becomes a GitHub release. The notes are the matching section of
# CHANGELOG.md. The job fails when the section is missing or the backend version does not match the tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"

          version_in_code=$(sed -n 's/^version = "\(.*\)"$/\1/p' backend/pyproject.toml | head -n 1)
          if [ "$version_in_code" != "$version" ]; then
            echo "tag $TAG does not match backend/pyproject.toml version $version_in_code" >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi

          notes=$(awk -v v="$version" '
            index($0, "## " v " ") == 1 || $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

          printf '%s\n' "$notes" | gh release create "$TAG" --title "$TAG" --verify-tag --notes-file -
