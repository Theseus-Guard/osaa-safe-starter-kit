name: safe-starter-kit

# Startup order: db -> db-roles (role setup, idempotent) -> migrate (migration owner) -> api, worker; gateway after api.
# Each runtime service uses its own database role and its own secret file. The bootstrap superuser (POSTGRES_USER)
# is used only by db and db-roles.
# Network split: "backend" is internal (no route to the host or to other networks, nothing published) and holds every
# service except the gateway. "edge" is attached to the gateway only; it is the one network with a route out and in.

x-app: &app
  build:
    context: ./backend
  image: safe-starter-kit-app:dev
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-db-target: &db-target
  SAFE_DB_HOST: db
  SAFE_DB_PORT: "5432"
  SAFE_DB_NAME: safe

services:
  db:
    image: postgres:18.6-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_DB: safe
      POSTGRES_USER: safe_app
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
      - db_migrator_password
      - db_app_password
      - db_worker_password
    volumes:
      - db-data:/var/lib/postgresql
      # Fresh volume only: the image runs this once, at first initialisation.
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # Local socket shared with db-roles: the bootstrap superuser is reached without a network password.
      - pg-socket:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safe_app -d safe"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend
    restart: unless-stopped

  # One-shot. Runs the same role script as the initdb hook, so existing volumes get the roles too.
  db-roles:
    image: postgres:18.6-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    entrypoint: ["sh", "/opt/safe/roles.sh"]
    environment:
      PGHOST: /var/run/postgresql
      POSTGRES_DB: safe
      POSTGRES_USER: safe_app
    secrets:
      - db_migrator_password
      - db_app_password
      - db_worker_password
    volumes:
      - ./db/init/10-roles.sh:/opt/safe/roles.sh:ro
      - pg-socket:/var/run/postgresql
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  migrate:
    <<: *app
    command: ["python", "-m", "safe_kit.migrate"]
    environment:
      <<: *db-target
      SAFE_DB_USER: safe_migrator
      SAFE_DB_PASSWORD_FILE: /run/secrets/db_migrator_password
    secrets:
      - db_migrator_password
    depends_on:
      db-roles:
        condition: service_completed_successfully
    networks:
      - backend
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "safe_kit.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *db-target
      # Demo mode: SAFE_BIND_HOST must be a loopback address for the startup guard. Nothing publishes this port; the
      # process listens on 0.0.0.0 inside the container so that the gateway (on backend) can reach it.
      SAFE_MODE: demo
      SAFE_BIND_HOST: 127.0.0.1
      SAFE_DATASET: synthetic-demo
      # The Docker host's address on the edge network (see the gateway note below). Demo mode only.
      SAFE_DEMO_HOST_ADDRESS: "172.28.0.1"
      SAFE_DB_USER: safe_api
      SAFE_DB_PASSWORD_FILE: /run/secrets/db_app_password
      SAFE_JWT_KEY_FILE: /run/secrets/jwt_signing_key
      SAFE_EVIDENCE_KEK_FILE: /run/secrets/evidence_kek
      SAFE_EVIDENCE_DIR: /var/lib/safe/evidence
      # Required by the startup guard, no defaults. Access token 60 minutes; refresh window 60 minutes of idleness;
      # session at most 12 hours from its login.
      SAFE_ACCESS_TTL_MINUTES: "60"
      SAFE_REFRESH_TTL_MINUTES: "60"
      SAFE_SESSION_MAX_HOURS: "12"
      # The gateway's fixed address on the backend network (see networks below). The API reads X-Forwarded-For only from
      # this address. Client address chain for a browser on the host (safe_kit/client_address.py):
      #   1. The browser connects to 127.0.0.1:8443. Docker publishes the gateway on loopback only and relays the
      #      connection over edge, so nginx sees the host's own address on edge, 172.28.0.1.
      #   2. nginx overwrites X-Forwarded-For with $remote_addr, that is 172.28.0.1, and connects to the API from
      #      172.29.0.10 (the gateway's address on backend).
      #   3. The API takes the socket peer 172.29.0.10 as trusted, walks X-Forwarded-For from the right, and resolves
      #      the client to 172.28.0.1. Demo sign-in accepts that address through SAFE_DEMO_HOST_ADDRESS (demo mode only).
      SAFE_TRUSTED_PROXIES: "172.29.0.10"
    secrets:
      - db_app_password
      - jwt_signing_key
      - evidence_kek
    volumes:
      - evidence-data:/var/lib/safe/evidence
    # Not published. The gateway is the only entry point; the CLI and the worker reach the API over backend.
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - backend

  worker:
    <<: *app
    command: ["python", "-m", "safe_kit.worker"]
    environment:
      <<: *db-target
      # The worker opens no listening socket; the loopback value only satisfies the demo-mode rule of the startup guard.
      SAFE_MODE: demo
      SAFE_BIND_HOST: 127.0.0.1
      SAFE_DATASET: synthetic-demo
      SAFE_DB_USER: safe_worker
      SAFE_DB_PASSWORD_FILE: /run/secrets/db_worker_password
      # The startup guard checks the same settings in every process, so the worker carries them too.
      SAFE_ACCESS_TTL_MINUTES: "60"
      SAFE_REFRESH_TTL_MINUTES: "60"
      SAFE_SESSION_MAX_HOURS: "12"
    secrets:
      - db_worker_password
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: safe-starter-kit-gateway:dev
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Loopback only. The demo has no other published port.
      - "127.0.0.1:8443:8443"
    # Only the certificate and key are mounted, not the whole secrets/tls directory (which holds the CA key).
    secrets:
      - source: gateway_tls_cert
        target: /etc/nginx/tls/server.crt
      - source: gateway_tls_key
        target: /etc/nginx/tls/server.key
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      edge:
        # Fixed address on the edge bridge. Nothing else on edge gets it.
        ipv4_address: 172.28.0.10
      backend:
        # Fixed, so that the API can name the gateway in SAFE_TRUSTED_PROXIES. Nothing else on backend gets it.
        ipv4_address: 172.29.0.10
    restart: unless-stopped

  cli:
    build:
      context: ./backend
    image: safe-starter-kit-app:dev
    profiles: ["cli"]
    entrypoint: ["python", "-m", "safe_kit.cli"]
    command: ["health"]
    environment:
      SAFE_API_URL: http://api:8000
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_migrator_password:
    file: ./secrets/db_migrator_password.txt
  db_app_password:
    file: ./secrets/db_app_password.txt
  db_worker_password:
    file: ./secrets/db_worker_password.txt
  jwt_signing_key:
    file: ./secrets/jwt_signing_key.txt
  evidence_kek:
    file: ./secrets/evidence_kek.txt
  # Gateway TLS certificate and key, generated by scripts/make-dev-cert.sh or supplied by the operator.
  gateway_tls_cert:
    file: ./secrets/tls/server.crt
  gateway_tls_key:
    file: ./secrets/tls/server.key

networks:
  # Only the gateway is attached. Fixed subnet: the host's address here is 172.28.0.1, the gateway is 172.28.0.10.
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  # Internal: no route to the host or to other networks. Every service except the gateway is attached only here.
  # Fixed subnet so that the gateway has a known address on it (172.29.0.10).
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  db-data: {}
  evidence-data: {}
  pg-socket: {}
