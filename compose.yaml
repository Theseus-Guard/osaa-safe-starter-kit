name: safe-starter-kit

# Skeleton: PostgreSQL -> one-shot migration -> API/worker; the gateway and the container CLI use the same API.
# Network split: "backend" is internal (no external egress, DB port not published); "edge" is only for the gateway.

x-app: &app
  build:
    context: ./backend
  image: safe-starter-kit-app:dev
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment:
    SAFE_DB_HOST: db
    SAFE_DB_NAME: safe
    SAFE_DB_USER: safe_app
    SAFE_DB_PASSWORD_FILE: /run/secrets/db_password
  secrets:
    - db_password
  restart: unless-stopped

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: safe
      POSTGRES_USER: safe_app
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safe_app -d safe"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["python", "-m", "safe_kit.migrate"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "safe_kit.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SAFE_DB_HOST: db
      SAFE_DB_NAME: safe
      SAFE_DB_USER: safe_app
      SAFE_DB_PASSWORD_FILE: /run/secrets/db_password
      SAFE_JWT_KEY_FILE: /run/secrets/jwt_signing_key
    secrets:
      - db_password
      - jwt_signing_key
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - edge
      - backend

  worker:
    <<: *app
    command: ["python", "-m", "safe_kit.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: safe-starter-kit-gateway:dev
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${SAFE_GATEWAY_BIND:-127.0.0.1}:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge
    restart: unless-stopped

  cli:
    build:
      context: ./backend
    image: safe-starter-kit-app:dev
    profiles: ["cli"]
    entrypoint: ["python", "-m", "safe_kit.cli"]
    command: ["health"]
    environment:
      SAFE_API_URL: http://api:8000
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

secrets:
  db_password:
    file: ./secrets/db_password.txt
  jwt_signing_key:
    file: ./secrets/jwt_signing_key.txt

networks:
  edge: {}
  backend:
    internal: true

volumes:
  db-data: {}
